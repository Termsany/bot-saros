# bot.da3m.io is retired (owner, 2026-11-06): the paper bots' page is demo.da3m.io (nginx-demo.da3m.io.conf).
# The name answers 410 Gone, on its own certificate, until its DNS record is deleted. Without this block, nginx would
# answer the name with another site of this server. Once the DNS record is gone: remove this site and
# `certbot delete --cert-name bot.da3m.io`.
# certbot --nginx -d bot.da3m.io adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name bot.da3m.io;

    add_header X-Content-Type-Options nosniff always;
    location / { return 410; }
}
