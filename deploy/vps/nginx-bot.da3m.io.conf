# Read-only public page of the paper bot: static index.html + status.json written by bot.py --public.
# certbot --nginx -d bot.da3m.io adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name bot.da3m.io;

    root /var/www/bot.da3m.io;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://stream.bybit.com; frame-ancestors 'none'" always;

    location = /status.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.tmp$ { deny all; }
    location / { try_files $uri $uri/ =404; }
}
