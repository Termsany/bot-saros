# Public page of the real-money bots (owner's choice, 2026-11-03): static index.html + live.json written every 20 s by
# raqm-realbot-export (scripts/realbot_export.py, filtered: positions and closed trades only).
# certbot --nginx -d realbot.da3m.io adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name realbot.da3m.io;

    root /var/www/realbot.da3m.io;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://fstream.binance.com; frame-ancestors 'none'" always;

    location = /live.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
