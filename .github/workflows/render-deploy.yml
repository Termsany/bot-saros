# Deploys the backend on Render when backend code lands on main.
# The Render service was created from a public repo URL, and Render never auto-deploys those —
# so GitHub calls the service's Deploy Hook instead.
#
# Setup (once): Render dashboard -> bot-saros-backend -> Settings -> Deploy Hook -> copy the URL,
# then GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   name: RENDER_DEPLOY_HOOK_URL   value: <the deploy hook URL>
# The hook URL is a secret: anyone who has it can trigger deploys.
name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "*.py"  # backtest.py, bot.py, strategies_advanced.py — imported by the backend
  workflow_dispatch:  # manual run from the Actions tab

concurrency:
  group: render-deploy
  cancel-in-progress: false  # let a running deploy finish; the next one deploys the newer commit

permissions: {}  # the job only calls Render; it needs no GitHub permissions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy of this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set — see the setup steps at the top of this workflow"
            exit 1
          fi
          # ref= deploys exactly this commit (not whatever main is when Render picks it up)
          curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}" -o /dev/null -w "Render responded HTTP %{http_code}\n"
